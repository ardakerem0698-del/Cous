<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Among Us Vent</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:Arial}#role{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:black;font-size:48px;z-index:9}#game{position:relative;width:100vw;height:100vh}.player,.vent{position:absolute}.player{width:28px;height:28px;background:cyan;border-radius:50%}.vent{width:36px;height:36px;background:#666;border-radius:50%;border:3px solid #aaa;text-align:center;line-height:36px}button{padding:10px;margin:4px}</style></head><body><div id="role"></div><div id="game"><div id="p" class="player"></div><div id="v1" class="vent" style="left:80px;top:120px">V</div><div id="v2" class="vent" style="left:320px;top:320px">V</div></div><div style="position:fixed;bottom:10px;width:100%"><button onclick="mv(0,-20)">▲</button><br><button onclick="mv(-20,0)">◀</button><button onclick="vent()">VENT</button><button onclick="mv(20,0)">▶</button><br><button onclick="mv(0,20)">▼</button></div><script>let impostor=Math.random()<0.3;role.innerHTML=impostor?'IMPOSTOR':'CREWMATE';role.style.color=impostor?'red':'cyan';setTimeout(()=>role.remove(),2500);let x=150,y=150;p.style.left=x+'px';p.style.top=y+'px';function mv(dx,dy){x+=dx;y+=dy;draw()}function draw(){p.style.left=x+'px';p.style.top=y+'px'}function vent(){if(!impostor){alert('Sadece impostor vent kullanabilir!');return;}let d1=Math.hypot(x-80,y-120);let d2=Math.hypot(x-320,y-320);if(d1<60){x=320;y=320;draw();alert('Vent ile ışınlandın!');}else if(d2<60){x=80;y=120;draw();alert('Vent ile ışınlandın!');}else alert('Bir ventin yanına git!');}</script></body></html>
